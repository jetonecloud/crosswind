[project]
name = "crosswind"
version = "0.1.0"
description = "Read-only Terraform drift checker that shows what changed, who changed it, and why it matters."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Jet1", email = "hello@jetonecloud.com" }]
keywords = ["terraform", "opentofu", "drift", "aws", "cloudtrail", "devops"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
  # Imported directly for exit handling, and we rely on the separated
  # stdout/stderr streams in CliRunner that 8.2 introduced.
  "click>=8.2",
  "boto3>=1.34",
  "rich>=13.7",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jetonecloud/crosswind"
Issues = "https://github.com/jetonecloud/crosswind/issues"
Releases = "https://github.com/jetonecloud/crosswind/releases"
Security = "https://github.com/jetonecloud/crosswind/blob/main/SECURITY.md"
Changelog = "https://github.com/jetonecloud/crosswind/blob/main/CHANGELOG.md"

[project.scripts]
crosswind = "crosswind.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/crosswind"]
strict = true
warn_unreachable = true

# boto3/botocore ship no usable type information and the typed stubs are a
# large dependency for the handful of calls we make. The session and
# CloudTrail wrappers are the only places they are touched.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: end-to-end tests that invoke a real terraform/tofu binary",
]

[tool.coverage.run]
source = ["crosswind"]
