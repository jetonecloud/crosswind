name: Release

# Tagging `v*` cuts a release. The whole of CI runs first, so a tag cannot
# ship something that doesn't pass — and the tag is checked against
# `crosswind.__version__`, so a tag that disagrees with the code fails before
# anything is published.
on:
  push:
    tags: ["v*"]

  # So a release can be re-cut by hand if a publish step failed after the
  # artifacts were built. Re-running is safe: every step overwrites rather
  # than appends.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Refuse early, before anything is built, if the tag and the code disagree.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"

          # Read it without installing, so a broken dependency can't make
          # this step lie about the version.
          declared="$(python -c "
          import pathlib, re
          text = pathlib.Path('src/crosswind/__init__.py').read_text()
          print(re.search(r'__version__ = \"([^\"]+)\"', text).group(1))
          ")"

          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $tag implies version $version, but " \
                 "crosswind.__version__ is $declared. Bump one of them."
            exit 1
          fi

          # The changelog is the release notes, so it has to have an entry.
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version)"

  # The full suite, including e2e against both binaries. A tag must not ship
  # something main wouldn't.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build

      - name: Build the wheel and sdist
        run: python -m build

      - name: Check the artifacts are what we expect
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist/
          test -f "dist/crosswind-$VERSION-py3-none-any.whl"
          test -f "dist/crosswind-$VERSION.tar.gz"

          # The YAML data files are loaded through importlib.resources. If
          # packaging drops them, every scan fails at the first rule lookup
          # — so this is checked here rather than discovered by a user.
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          for required in (
              "crosswind/data/severity.yml",
              "crosswind/data/cloudtrail.yml",
              "crosswind/data/cost.yml",
          ):
              assert required in names, f"{required} missing from {wheel}"
          print("data files present in the wheel")
          PY

      - name: Smoke-test the wheel in a clean environment
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/crosswind version

          # `demo` from a directory with no source tree is the first thing
          # anyone runs, and it is a release criterion.
          cd /tmp
          /tmp/clean/bin/crosswind demo > /dev/null
          /tmp/clean/bin/crosswind demo --format json --output-dir /tmp/r > /dev/null
          /tmp/clean/bin/crosswind demo --format html --output-dir /tmp/r > /dev/null
          /tmp/clean/bin/crosswind demo --format markdown --output-dir /tmp/r > /dev/null
          python -c "import json; json.load(open('/tmp/r/crosswind-report.json'))"
          echo "clean install works"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > checksums.txt
          cat checksums.txt

      # Ties each artifact to this workflow run and this commit. A wheel
      # uploaded by hand will not verify, even by someone with write access.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/crosswind-*"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  container:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters: a lot of CI and most laptops are on it now.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.check.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [check, build, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract this version's changelog entry
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # Everything between this version's heading and the next one. The
          # changelog is already written for a reader, so it is the release
          # notes rather than something generated from commit subjects.
          python - <<'PY' > release-notes.md
          import os, pathlib, re

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          body = match.group(1).strip() if match else ""
          print(body)
          PY

          {
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "pipx install git+https://github.com/${{ github.repository }}@${{ needs.check.outputs.tag }}"
            echo '```'
            echo
            echo "Or the attached wheel, if the machine has no \`git\`. Verify first:"
            echo
            echo '```sh'
            echo "gh release download ${{ needs.check.outputs.tag }} --repo ${{ github.repository }}"
            echo "sha256sum --check --ignore-missing checksums.txt"
            echo "gh attestation verify crosswind-${{ needs.check.outputs.version }}-py3-none-any.whl --repo ${{ github.repository }}"
            echo '```'
            echo
            echo "Container image, with OpenTofu included:"
            echo
            echo '```sh'
            echo "docker run --rm ghcr.io/${{ github.repository }}:${{ needs.check.outputs.version }} demo"
            echo '```'
            echo
            echo "GitHub Action — pinning the action pins the tool:"
            echo
            echo '```yaml'
            echo "- uses: ${{ github.repository }}@${{ needs.check.outputs.tag }}"
            echo '```'
          } >> release-notes.md

          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          # A pre-1.0 version is marked as a pre-release, because the JSON
          # schema and the rule ids are still allowed to move.
          prerelease=""
          case "$VERSION" in
            0.*) prerelease="--prerelease" ;;
          esac

          # Idempotent, so a re-run after a half-failed publish works.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Crosswind $TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Crosswind $TAG" \
              --notes-file release-notes.md \
              $prerelease
          fi

          gh release view "$TAG"

  # Move the floating major tag so `@v0` keeps working. Done last, so it only
  # ever points at a release that fully published.
  floating-tag:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0

      - name: Point vN at this release
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major"
          git push -f origin "$major"
          echo "$major now points at ${{ needs.check.outputs.tag }}"
